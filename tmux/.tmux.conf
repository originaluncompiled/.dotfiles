# Start window numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1   # (optional, but nice to keep consistent with windows)

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Change the status bar colors (bottom bar)
set -g status-style bg="#639967",fg="#dbd8cc"

# Optional: make the left side show session name, right side show date/time
# set -g status-left "#[fg=colour117,bold][#S]  "
# set -g status-right "#[fg=colour224]%H:%M %d-%b-%Y"

# Remap the main prefix from Ctrl-b to Ctrl-a (most people do this)
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# More intuitive keybinds for splitting panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-like pane navigation (if you use vim, you'll love this)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with HJKL (hold prefix + repeated key)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Keep Esc responsive in Vim/Neovim while still allowing Alt-key sequences.
set -sg escape-time 10

# Quick window creation and switching
bind c new-window -c "#{pane_current_path}"
bind Space next-window
bind BSpace previous-window
